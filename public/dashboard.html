<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KS1 Dashboard</title>
  <style>
    body { background: #050A16; color: white; padding: 20px; font-family: Arial, sans-serif; }
    .card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; margin: 10px 0; }
    pre { background: #000; padding: 10px; border-radius: 5px; overflow: auto; }
  </style>
</head>
<body>
  <h1>KS1 Command Center – Dashboard</h1>
  <div class="card">
    <button onclick="fetchData()">Load Dashboard Stats</button>
    <pre id="output">Click "Load Dashboard Stats"</pre>
  </div>

  <script>
    async function fetchData() {
      const token = localStorage.getItem('adminToken');
      if (!token) {
        alert('Not logged in!');
        window.location.href = '/login.html';
        return;
      }

      try {
        const res = await fetch('/api/admin/dashboard', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        console.error(err);
        document.getElementById('output').textContent = 'Failed to load data';
      }
    }
  </script>
</body>
</html>
